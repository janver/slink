name: 自动部署到 CF Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN: ${{ secrets.ADMIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
    
    steps:
      - name: ⬇️ 检出仓库
        uses: actions/checkout@v4

      - name: 🛠️ 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🆙 更新并安装最新 Wrangler
        run: npm install -g wrangler@latest
    
      - name: 🔄 替换 wrangler.toml 中的变量
        id: config_setup
        run: |
          [ -n "${CF_KV_ID}" ] || { echo "🔴 错误: 必须设置 'CF_KV_ID' 变量"; exit 1; }
          sed -i "s#{CF_KV_ID}#${CF_KV_ID}#g" wrangler.toml
          
          WORKER_NAME=$(grep '^name =' wrangler.toml | awk -F '"' '{print $2}')
          [ -n "$WORKER_NAME" ] || { echo "🔴 错误: 未能在 wrangler.toml 中找到 'name' 字段"; exit 1; }
          
          echo -e "\n🎉 项目配置信息如下:"
          echo "------------------"
          cat wrangler.toml
          echo "------------------"
          echo "worker_name=$WORKER_NAME" >> $GITHUB_OUTPUT

      - name: ⚙️ 检查并生成 wrangler vars
        id: dynamic_vars
        run: |
          VARS=""
          [ -n "$ADMIN" ] && VARS+="ADMIN"$'\n' || echo "⚠️ 警告: 未设置 ADMIN 变量，默认为 admin"
          [ -n "$PASSWORD" ] && VARS+="PASSWORD"$'\n' || echo "⚠️ 警告: 未设置 PASSWORD 变量，默认为 apipass"

          if [ -n "$VARS" ]; then
            printf 'vars_list<<EOF\n%sEOF\n' "$VARS" >>"$GITHUB_OUTPUT"
            echo -e "\n✅ 传递给 Wrangler 的环境变量名:"
            printf '%s' "$VARS"
          else
            echo -e "\n⚠️ 没有需要传递的变量名"
            printf 'vars_list=\n' >>"$GITHUB_OUTPUT"
          fi
          
      - name: 🚀 部署到 CF Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          vars: ${{ steps.dynamic_vars.outputs.vars_list }}
          
      - name: ✨ 输出 Worker 管理后台
        env:
          WORKER_NAME: ${{ steps.config_setup.outputs.worker_name }}
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo -e "\n✨✨✨ 部署完成 ✨✨✨"
          echo "🌐 点击以下链接可访问项目管理后台"
          echo "https://dash.cloudflare.com/${ACCOUNT_ID}/workers/services/view/${WORKER_NAME}/production/settings"
          echo "🚀 建议: 给项目绑定一个自定义域名"
          
